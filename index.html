<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cetak Label Traceability</title>
    <link href="bootstrap.min.css" rel="stylesheet">
    <link rel="shortcut icon" href="logoo.ico" type="image/x-icon">
</head>
<body class="bg-light">
<header class="d-flex align-items-center justify-content-between px-4 px-md-5 border-bottom sticky-top" 
        style="height: 80px; background-color: rgba(2, 18, 56, 0.85); backdrop-filter: blur(12px); border-color: #1e293b !important; z-index: 1030;">       
    <nav class="d-flex align-items-center">
        <a href="index.html" class="text-white text-decoration-none m-0" style="font-size: 2.25rem; font-weight: 900; letter-spacing: -1.5px;">
            PPIC<span style="color: #06b6d4;">SOMIC</span>
        </a>
    </nav>
</header>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">Form Cetak Label Traceability</h5>
                </div>
                <div class="card-body">
                    <form id="formCetak">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Pilih Traceability</label>
                            <select class="form-select" id="model_type" required>
                                <option value="">-- Pilih Label --</option>
                                <option value="Template 1">Traceability D03B</option>
                                <option value="Template 2">Traceability Soket Y4L</option>
                                <option value="Template 3">Traceability Soket YLO</option>
                                <option value="Template 4">Traceability Soket YR9</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Operator</label>
                            <input type="text" class="form-control" id="operator_name" placeholder="Ketik nama Anda..." required>
                        </div>
                        <div id="kolom_khusus" style="display: none;">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tanggal Assembly</label>
                            <input type="date" class="form-control" id="assembly_date">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Tanggal Inspection</label>
                            <input type="date" class="form-control" id="inspection_date">
                        </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-bold">Tanggal Packing</label>
                            <input type="date" class="form-control" id="packing_date" required>
                        </div>
                        <div class="mb-4">
                           <label class="form-label fw-bold text-danger">Jumlah Cetak</label>
                           <input type="number" class="form-control border-danger" id="print_copies" value="1" min="1" required>
                        </div>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg" id="btnSubmit">Generate Label</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="previewModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-md modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-success text-white">
        <h5 class="modal-title">Preview Label Thermal</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <p class="text-muted small mb-2">Pastikan tata letak sudah pas sebelum dicetak ke printer.</p>
        <img id="labelImage" src="" alt="Label Preview" class="img-fluid border p-2 shadow-sm bg-white" style="max-width: 90%;">
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Tutup</button>
        <button type="button" id="btnCetakFisik" class="btn btn-dark">🖨️ Cetak ke Printer</button>
      </div>
    </div>
  </div>
</div>
<script src="bootstrap.bundle.min.js"></script>

<script>

document.addEventListener("DOMContentLoaded", function() {
    // 1. Munculkan otomatis nama operator yang tersimpan (Kode asli Abang)
    var savedName = localStorage.getItem("saved_operator_name");
    if (savedName) {
        document.getElementById("operator_name").value = savedName;
    }

    // 2. Set "Date Packing" otomatis ke Hari Ini
    var today = new Date();
    var yyyy = today.getFullYear();
    var mm = String(today.getMonth() + 1).padStart(2, '0'); // Bulan mulai dari 0, makanya +1
    var dd = String(today.getDate()).padStart(2, '0');
    var packingFormatted = yyyy + '-' + mm + '-' + dd;
    
    document.getElementById("packing_date").value = packingFormatted;

    // 3. Set "Inspection Date" otomatis ke H-3
    var inspDate = new Date();
    inspDate.setDate(today.getDate() - 3); // Rumus mundur 3 hari
    var inspYyyy = inspDate.getFullYear();
    var inspMm = String(inspDate.getMonth() + 1).padStart(2, '0');
    var inspDd = String(inspDate.getDate()).padStart(2, '0');
    var inspFormatted = inspYyyy + '-' + inspMm + '-' + inspDd;
    
    document.getElementById("inspection_date").value = inspFormatted;
});

function formatDate(dateString) {
    if (!dateString) return '';
    var date = new Date(dateString);
    var months = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
    
    var day = date.getDate().toString().padStart(2, '0');
    var month = months[date.getMonth()];
    var year = date.getFullYear();
    
    return day + " " + month + " " + year;
}

var previewModal = new bootstrap.Modal(document.getElementById('previewModal'));

        var partNo1   = "45253-77510";
        var partNo2   = "(A-261-206-Z)";
        var backNo    = "B014";
        var qty       = "40 PCS";
        var customer1 = "PT.NTC/";

        zpl += "^FO230,40^A0N,30,30^FDPT. SOMIC INDONESIA^FS\n";
        zpl += "^FO590,20^A0N,18,18^FDBack No.^FS\n";
        zpl += "^FO620,40^A0N,40,40^FD" + backNo + "^FS\n";
        zpl += "^FO80,100^A0N,22,22^FDPart Name^FS\n";
        zpl += "^FO370,100^A0N,22,22^FDPart NO.^FS\n";
        zpl += "^FO590,105^A0N,20,20^FDQTY:^FS\n";

        zpl += "^FO630,310^A0N,40,40^FD" + operator + "^FS\n";
    }


    zpl += "^XZ";

    fetch('https://api.labelary.com/v1/printers/8dpmm/labels/4x2/0/', {
        method: 'POST',
        headers: {
            'Accept': 'image/png',
            'Content-Type': 'application/x-www-form-urlencoded'
        },
        body: zpl
    })
    .then(function(response) {
        if (!response.ok) throw new Error("Gagal merender gambar label");
        return response.blob();
    })
    .then(function(blob) {
        var imageUrl = URL.createObjectURL(blob);
        document.getElementById('labelImage').src = imageUrl;
        previewModal.show();
        submitBtn.innerHTML = "Generate Label";
        submitBtn.disabled = false;
    })
    .catch(function(error) {
        console.error('Error:', error);
        alert('Terjadi kesalahan saat memproses label.');
        submitBtn.innerHTML = "Generate Label";
        submitBtn.disabled = false;
    });

// Fungsi untuk memunculkan/menyembunyikan form sesuai template
document.getElementById('model_type').addEventListener('change', function() {
    var kolomKhusus = document.getElementById('kolom_khusus');
    
    if (this.value === 'Template 1') {
        kolomKhusus.style.display = 'block'; 
    } else {
        kolomKhusus.style.display = 'none';  
    }
});

document.getElementById('btnCetakFisik').addEventListener('click', function() {
    var imgSrc = document.getElementById('labelImage').src;
    var printCopies = parseInt(document.getElementById('print_copies').value) || 1;
    
    if(!imgSrc || imgSrc === "") {
        alert("Generate labelnya dulu ya Bang!");
        return;
    }

    var printWindow = window.open('', '_blank');
    
    var htmlContent = '<!DOCTYPE html><html><head><title>Print Label A4</title>';
    htmlContent += '<style>';
    htmlContent += '*, *::before, *::after { box-sizing: border-box; } ';
    htmlContent += '@page { size: A4 portrait; margin: 5mm; } ';
    htmlContent += 'body { margin: 0; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 4mm; align-content: start; } ';
    htmlContent += '.label-box { width: 9.5cm; height: 4.8cm; border: 1px dashed #999; page-break-inside: avoid; break-inside: avoid; display: flex; justify-content: center; align-items: center; } ';
    htmlContent += '.label-box img { max-width: 100%; max-height: 100%; object-fit: contain; } ';
    htmlContent += '<' + '/style><' + '/head><body>';
    
    for (var i = 0; i < printCopies; i++) {
        htmlContent += '<div class="label-box"><img src="' + imgSrc + '"><' + '/div>';
    }
    
    htmlContent += '<' + '/body><' + '/html>';
    
    printWindow.document.write(htmlContent);
    printWindow.document.close();
    printWindow.focus();
    
    setTimeout(function() {
        printWindow.print();
        printWindow.close();
    }, 1000); 
});

</script>
